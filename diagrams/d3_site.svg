<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t{fill:#111827} .s{fill:#6b7280} .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#ar3)}
    .ln2{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#ar3);stroke-dasharray:6 4}
    .dev{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5} .site{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}
    .cld{fill:#d1fae5;stroke:#047857;stroke-width:1.5}
  </style>

  <rect x="16" y="16" width="700" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="44" class="t" font-size="16" font-weight="700">Сеть площадки: полная независимость от Wi-Fi дилера</text>

  <!-- Бейджи -->
  <g>
    <rect x="40" y="70" width="120" height="56" rx="8" class="dev"/>
    <rect x="48" y="78" width="120" height="56" rx="8" class="dev"/>
    <rect x="56" y="86" width="120" height="56" rx="8" class="dev"/>
    <text x="68" y="110" class="t" font-size="13" font-weight="600">Бейджи ×20</text>
    <text x="68" y="128" class="s" font-size="11.5">Wi-Fi 2.4 ГГц, WPA3</text>
  </g>

  <!-- AP -->
  <rect x="280" y="70" width="190" height="80" rx="8" class="site"/>
  <text x="292" y="94" class="t" font-size="13" font-weight="600">Своя точка доступа</text>
  <text x="292" y="112" class="s" font-size="11.5">MikroTik hAP ax² · 12 490 ₽</text>
  <text x="292" y="127" class="s" font-size="11.5">скрытый SSID, изолированный</text>
  <text x="292" y="142" class="s" font-size="11.5">VLAN только до шлюза</text>

  <path class="ln" d="M176,110 L280,110"/>
  <text x="196" y="102" class="s" font-size="11">802.11n</text>

  <!-- Доки -->
  <rect x="40" y="200" width="190" height="70" rx="8" class="dev"/>
  <text x="52" y="224" class="t" font-size="13" font-weight="600">Мульти-доки 2×10</text>
  <text x="52" y="242" class="s" font-size="11.5">зарядка ночью + выгрузка</text>
  <text x="52" y="257" class="s" font-size="11.5">хвостов записи дня</text>
  <path class="ln" d="M135,200 C135,164 220,130 280,122"/>

  <!-- Шлюз -->
  <rect x="280" y="200" width="190" height="120" rx="8" class="site"/>
  <text x="292" y="224" class="t" font-size="13" font-weight="600">Шлюз: мини-ПК N100</text>
  <text x="292" y="242" class="s" font-size="11.5">26 900 ₽ · 16 ГБ · SSD 512</text>
  <text x="292" y="257" class="s" font-size="11.5">буфер 7 дней (~1 ГБ/день)</text>
  <text x="292" y="272" class="s" font-size="11.5">сборка сегментов, дедуп,</text>
  <text x="292" y="287" class="s" font-size="11.5">mTLS-туннель WireGuard</text>
  <text x="292" y="302" class="s" font-size="11.5">этап 2: триггеры/подсказки</text>
  <path class="ln" d="M375,150 L375,200"/>
  <text x="385" y="180" class="s" font-size="11">Ethernet</text>

  <!-- Аплинки -->
  <rect x="520" y="70" width="170" height="80" rx="8" class="site"/>
  <text x="532" y="94" class="t" font-size="13" font-weight="600">LTE-роутер</text>
  <text x="532" y="112" class="s" font-size="11.5">Keenetic Runner 4G ~9 000 ₽</text>
  <text x="532" y="127" class="s" font-size="11.5">SIM 35–150 ГБ ≈1 000 ₽/мес</text>
  <text x="532" y="142" class="s" font-size="11.5">трафик ≈30 ГБ/мес</text>

  <rect x="520" y="200" width="170" height="64" rx="8" class="site" stroke-dasharray="6 4"/>
  <text x="532" y="224" class="t" font-size="13" font-weight="600">Wi-Fi / LAN дилера</text>
  <text x="532" y="242" class="s" font-size="11.5">только как резервный</text>
  <text x="532" y="257" class="s" font-size="11.5">аплинк, если дают порт</text>

  <path class="ln" d="M470,244 L520,150 "/>
  <path class="ln2" d="M470,280 L520,240"/>

  <!-- Облако -->
  <rect x="760" y="120" width="180" height="140" rx="12" class="cld"/>
  <text x="776" y="148" class="t" font-size="14" font-weight="700">Облако РФ</text>
  <text x="776" y="168" class="s" font-size="12">Ingest API</text>
  <text x="776" y="186" class="s" font-size="12">приоритет выгрузки:</text>
  <text x="776" y="202" class="s" font-size="12">1) хвост текущего дня</text>
  <text x="776" y="218" class="s" font-size="12">2) вчерашние сегменты</text>
  <text x="776" y="234" class="s" font-size="12">3) телеметрия флота</text>

  <path class="ln" d="M690,110 C730,110 730,170 760,176"/>
  <text x="706" y="128" class="s" font-size="11">LTE</text>
  <path class="ln2" d="M690,232 C730,232 730,210 760,206"/>

  <!-- Сноска -->
  <text x="32" y="360" class="s" font-size="12.5">Деградация: нет LTE и нет порта дилера → бейджи копят на microSD (3 смены), шлюз — 7 дней;</text>
  <text x="32" y="378" class="s" font-size="12.5">данные не теряются, разбор приходит с задержкой. Wi-Fi дилера в норме не используется вовсе.</text>
  <text x="32" y="402" class="s" font-size="12.5" font-weight="600" fill="#b45309">CAPEX площадки: ≈62–74 тыс. ₽ (шлюз + AP + LTE + 2 мульти-дока) ≈ $40–46 на менеджера</text>
</svg>
