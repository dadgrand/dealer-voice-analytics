<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t{fill:#111827} .s{fill:#6b7280} .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    .ln2{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#ar);stroke-dasharray:6 4}
    .dev{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5} .site{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}
    .cld{fill:#d1fae5;stroke:#047857;stroke-width:1.5} .crm{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}
  </style>

  <!-- ЗОНА: Шоурум -->
  <rect x="16" y="40" width="270" height="490" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="32" y="66" class="t" font-size="15" font-weight="700">Площадка (шоурум) ×5…50</text>

  <rect x="40" y="88" width="220" height="86" rx="8" class="dev"/>
  <text x="52" y="112" class="t" font-size="13.5" font-weight="600">Бейдж-рекордер ×20</text>
  <text x="52" y="130" class="s" font-size="12">ESP32-S3 · 2× MEMS · microSD</text>
  <text x="52" y="146" class="s" font-size="12">Opus 24 кбит/с · AES · буфер 3 смены</text>
  <text x="52" y="162" class="s" font-size="12">запись всей смены, ноль кнопок</text>

  <rect x="40" y="206" width="220" height="64" rx="8" class="dev"/>
  <text x="52" y="230" class="t" font-size="13.5" font-weight="600">Док-станции 2×10 мест</text>
  <text x="52" y="248" class="s" font-size="12">зарядка + гарантированная</text>
  <text x="52" y="262" class="s" font-size="12">точка выгрузки в конце смены</text>

  <rect x="40" y="302" width="220" height="120" rx="8" class="site"/>
  <text x="52" y="326" class="t" font-size="13.5" font-weight="600">Шлюз площадки</text>
  <text x="52" y="344" class="s" font-size="12">мини-ПК N100 · буфер 7 дней</text>
  <text x="52" y="360" class="s" font-size="12">своя Wi-Fi AP (MikroTik, VLAN)</text>
  <text x="52" y="376" class="s" font-size="12">предобработка · mTLS-туннель</text>
  <text x="52" y="392" class="s" font-size="12">этап 2: локальные триггеры</text>
  <text x="52" y="408" class="s" font-size="12">NTP · fleet-агент · OTA-кэш</text>

  <rect x="40" y="452" width="220" height="58" rx="8" class="site"/>
  <text x="52" y="476" class="t" font-size="13.5" font-weight="600">Аплинк: LTE-роутер</text>
  <text x="52" y="494" class="s" font-size="12">осн. канал; Wi-Fi дилера — резерв</text>

  <path class="ln" d="M150,174 L150,206"/>
  <text x="158" y="196" class="s" font-size="11.5">док: USB/пого</text>
  <path class="ln" d="M150,270 L150,302"/>
  <path class="ln2" d="M260,131 C320,131 320,340 260,352"/>
  <text x="292" y="240" class="s" font-size="11.5" transform="rotate(90 292 240)">Wi-Fi: сегменты в течение дня</text>
  <path class="ln" d="M150,422 L150,452"/>

  <!-- ЗОНА: Облако РФ -->
  <rect x="340" y="40" width="360" height="490" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="356" y="66" class="t" font-size="15" font-weight="700">Облако в РФ (152-ФЗ, УЗ-3)</text>

  <rect x="360" y="84" width="150" height="56" rx="8" class="cld"/>
  <text x="372" y="106" class="t" font-size="13" font-weight="600">Ingest API</text>
  <text x="372" y="122" class="s" font-size="11.5">mTLS · идемпотентно</text>

  <rect x="530" y="84" width="150" height="56" rx="8" class="cld"/>
  <text x="542" y="106" class="t" font-size="13" font-weight="600">S3 (аудио)</text>
  <text x="542" y="122" class="s" font-size="11.5">std → cold, TTL 6 мес</text>

  <rect x="360" y="168" width="320" height="50" rx="8" class="cld"/>
  <text x="372" y="188" class="t" font-size="13" font-weight="600">Очередь заданий (NATS JetStream)</text>
  <text x="372" y="204" class="s" font-size="11.5">сборка смены → сегментация на разговоры → задания</text>

  <rect x="360" y="246" width="320" height="118" rx="8" class="cld"/>
  <text x="372" y="268" class="t" font-size="13" font-weight="600">GPU-воркеры (RTX 4090, автоскейл)</text>
  <text x="372" y="288" class="s" font-size="12">VAD Silero → диаризация: канальный приор +</text>
  <text x="372" y="304" class="s" font-size="12">pyannote → ASR GigaAM-v3 (RNNT) →</text>
  <text x="372" y="320" class="s" font-size="12">LLM-разбор T-Pro 2.0 32B (ночной батч)</text>
  <text x="372" y="342" class="s" font-size="11.5">днём ASR+диаризация · ночью LLM — те же GPU</text>

  <rect x="360" y="392" width="150" height="56" rx="8" class="cld"/>
  <text x="372" y="414" class="t" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="372" y="430" class="s" font-size="11.5">транскрипты · разборы</text>

  <rect x="530" y="392" width="150" height="56" rx="8" class="cld"/>
  <text x="542" y="414" class="t" font-size="13" font-weight="600">Backend API</text>
  <text x="542" y="430" class="s" font-size="11.5">Go · RBAC · аудит</text>

  <rect x="360" y="474" width="320" height="44" rx="8" class="cld"/>
  <text x="372" y="494" class="t" font-size="13" font-weight="600">Мониторинг: флот · пайплайн · качество</text>
  <text x="372" y="509" class="s" font-size="11.5">лаг очереди · % записанных смен · доля несопоставленных</text>

  <path class="ln" d="M260,478 C310,478 316,112 360,112"/>
  <text x="284" y="452" class="s" font-size="11.5">LTE / провод</text>
  <path class="ln" d="M510,112 L530,112"/>
  <path class="ln" d="M435,140 L435,168"/>
  <path class="ln" d="M520,218 L520,246"/>
  <path class="ln" d="M435,364 L435,392"/>
  <path class="ln" d="M510,420 L530,420"/>

  <!-- ЗОНА: Потребители -->
  <rect x="740" y="40" width="204" height="490" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="756" y="66" class="t" font-size="15" font-weight="700">Продукт</text>

  <rect x="756" y="84" width="172" height="92" rx="8" class="crm"/>
  <text x="768" y="106" class="t" font-size="13" font-weight="600">CRM (самописная)</text>
  <text x="768" y="124" class="s" font-size="11.5">модуль «Разговоры»:</text>
  <text x="768" y="139" class="s" font-size="11.5">карточка разбора в сделке,</text>
  <text x="768" y="154" class="s" font-size="11.5">плеер, чек-лист, возражения</text>

  <rect x="756" y="200" width="172" height="76" rx="8" class="crm"/>
  <text x="768" y="222" class="t" font-size="13" font-weight="600">Дашборд РОПа</text>
  <text x="768" y="240" class="s" font-size="11.5">воронка · возражения ·</text>
  <text x="768" y="255" class="s" font-size="11.5">рейтинг · план обучения</text>

  <rect x="756" y="300" width="172" height="76" rx="8" class="crm"/>
  <text x="768" y="322" class="t" font-size="13" font-weight="600">Telegram-бот</text>
  <text x="768" y="340" class="s" font-size="11.5">менеджеру: подтвердить</text>
  <text x="768" y="355" class="s" font-size="11.5">сделки одним тапом</text>

  <rect x="756" y="400" width="172" height="88" rx="8" class="crm" stroke-dasharray="6 4"/>
  <text x="768" y="422" class="t" font-size="13" font-weight="600">Этап 2: подсказки</text>
  <text x="768" y="440" class="s" font-size="11.5">часы/телефон менеджера,</text>
  <text x="768" y="455" class="s" font-size="11.5">стриминг ASR T-one,</text>
  <text x="768" y="470" class="s" font-size="11.5">задержка ≈1.5–3 с</text>

  <path class="ln" d="M680,420 C716,420 716,130 756,130"/>
  <path class="ln" d="M680,420 C716,420 716,238 756,238"/>
  <path class="ln" d="M680,420 C716,420 716,338 756,338"/>
  <path class="ln2" d="M680,300 C730,300 700,444 756,444"/>
</svg>
