<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Segoe UI, sans-serif">
  <style>
    .t{fill:#111827} .s{fill:#6b7280} .w{fill:#fff;font-size:12px;font-weight:600}
    .ax{stroke:#94a3b8;stroke-width:1.2} .grid{stroke:#e2e8f0;stroke-width:1}
    .lbl{fill:#334155;font-size:12.5px}
  </style>
  <text x="32" y="34" class="t" font-size="16" font-weight="700">Этап 2: бюджет задержки подсказки (от слов клиента до вибрации на часах)</text>

  <!-- Ось времени 0..3000 мс; масштаб: x = 130 + мс * 0.26 -->
  <line x1="130" y1="380" x2="940" y2="380" class="ax"/>
  <g class="s" font-size="11.5">
    <line x1="130" y1="60" x2="130" y2="384" class="grid"/><text x="122" y="400">0</text>
    <line x1="260" y1="60" x2="260" y2="384" class="grid"/><text x="240" y="400">0.5 с</text>
    <line x1="390" y1="60" x2="390" y2="384" class="grid"/><text x="378" y="400">1 с</text>
    <line x1="520" y1="60" x2="520" y2="384" class="grid"/><text x="500" y="400">1.5 с</text>
    <line x1="650" y1="60" x2="650" y2="384" class="grid"/><text x="638" y="400">2 с</text>
    <line x1="780" y1="60" x2="780" y2="384" class="grid"/><text x="760" y="400">2.5 с</text>
    <line x1="910" y1="60" x2="910" y2="384" class="grid"/><text x="898" y="400">3 с</text>
  </g>

  <!-- Полосы: LLM-путь -->
  <text x="32" y="86" class="t" font-size="13" font-weight="700">LLM-подсказка</text>
  <!-- захват+кадр 0-120 -->
  <rect x="130" y="96" width="31" height="30" fill="#1d4ed8"/>
  <text x="166" y="116" class="lbl">захват + Opus-кадры 20 мс + Wi-Fi до шлюза ≈ 120 мс</text>
  <!-- сеть шлюз-облако 120-200 -->
  <rect x="161" y="136" width="21" height="30" fill="#b45309"/>
  <text x="190" y="156" class="lbl">шлюз → облако (LTE RTT) ≈ 80 мс</text>
  <!-- ASR partial 200-530 -->
  <rect x="182" y="176" width="86" height="30" fill="#047857"/>
  <text x="276" y="196" class="lbl">стриминг-ASR T-one: partial ≈ 330 мс [бенчмарк]</text>
  <!-- триггер 530-580 -->
  <rect x="268" y="216" width="13" height="30" fill="#7c3aed"/>
  <text x="289" y="236" class="lbl">детектор триггера (правила + классификатор) ≈ 50 мс</text>
  <!-- LLM 580-1400 -->
  <rect x="281" y="256" width="213" height="30" fill="#7c3aed"/>
  <text x="502" y="276" class="lbl">LLM 8B: подсказка ≤30 токенов, TTFT+генерация ≈ 800 мс</text>
  <!-- push 1400-1800 -->
  <rect x="494" y="296" width="104" height="30" fill="#be185d"/>
  <text x="606" y="316" class="lbl">доставка: WebSocket на телефон + зеркало на часы ≈ 400 мс</text>
  <text x="606" y="352" class="t" font-size="13.5" font-weight="700">итого ≈ 1.8 с ✓ (цель ≤ 3 с)</text>

  <!-- Быстрый путь -->
  <text x="32" y="440" class="t" font-size="13" font-weight="700">Быстрый путь (без LLM): триггер по ключевым фразам на шлюзе → готовый шаблон ≈ 0.7 с.</text>
  <text x="32" y="458" class="s" font-size="12.5">Деградация: нет интернета → работает только быстрый путь; нет Wi-Fi до шлюза → подсказок нет, запись продолжается.</text>

  <!-- Пояснение к финализации -->
  <text x="32" y="418" class="s" font-size="12.5">Пауза в реплике клиента (600 мс тишины) финализирует фразу — подсказка приходит в естественной паузе, а не перебивает.</text>
</svg>
